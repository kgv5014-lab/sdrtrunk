# Copy this file to config.toml and edit it. Every setting is optional.

[server]
# 127.0.0.1 keeps the service private to this PC. Use 0.0.0.0 only if SDRTrunk runs on another machine.
host = "127.0.0.1"
port = 3000
# Optional. If set, enter the same value as the API Key in SDRTrunk's Rdio Scanner streaming entry.
api_key = ""
# Audio files and the calls.db call log are stored here.
data_dir = "data"

[transcription]
# faster-whisper (runs Whisper in this process on your GPU)
# whisper-cpp    (sends audio to a running whisper.cpp server)
# none           (log calls without transcribing)
backend = "faster-whisper"
language = "en"
# Calls shorter than this are logged but not transcribed; Whisper invents words on tiny clips.
min_duration_s = 1.0
beam_size = 5
# One term per line: unit names, street names, 10-codes. Helps Whisper spell local names.
vocabulary_file = "vocabulary.txt"
# Drop text Whisper made up: a whole call of "Thank you." heard with low confidence, the same words
# over and over, counting runs ("11, 12, 13, 14..."), and echoes of the hint list.
junk_filter = true
# A call that is only a stock phrase like "Thank you." is dropped when Whisper's confidence (shown as
# "low confidence" on the call log page below -0.8) is below this.
stock_phrase_logprob = -0.7
# With language = "en": keep Whisper from writing other scripts (Korean, Chinese, Cyrillic, Arabic...),
# which it sometimes does on noise, and remove any that still get through.
english_only = true
# Also forbid other scripts while Whisper decodes. Slow (3-7x on a GTX 1070 Ti for the same text), so
# off; english_only above still removes any that get through.
block_other_scripts = false
# Stop a call that runs away into a loop ("RIT, RIT, RIT...") from holding up the queue: Whisper may
# write at most this many tokens per second of audio (about 4 words a second). 0 = no limit.
max_tokens_per_second = 8.0
# When a try comes out as a loop or very unsure, Whisper tries again at these temperatures. Whisper's
# own list goes up to 1.0 (six tries), which is slow and mostly adds made-up text on radio audio.
temperatures = [0.0, 0.2, 0.4]
# When calls pile up, ones on these talkgroups are transcribed first, in this order, so fire and EMS
# dispatch (and their alerts) don't wait behind police chatter. Matched against the talkgroup's name,
# group or number. Everything else waits its turn, oldest first.
first_talkgroups = ["Countywide", "Fire", "FD", "EMS", "Med", "Ops", "Tac"]

[audio]
# Clean up each call before Whisper hears it: keep only the voice band (drops the low hum of
# CTCSS/DCS tones and high hiss) and bring the speech to a standard level, so quiet channels
# transcribe as well as loud ones. Saved recordings are not changed.
clean = true
# Also cut out steady tones such as paging tones and alert beeps. Whisper tends to invent words
# like "Thank you" over them.
remove_tones = true
# Also turn down the steady hiss on weak FM channels (T-band, UHF fire). Calls without hiss, such as
# P25, are left as they are. Adds a few hundredths of a second per call.
reduce_hiss = true
# Hide calls that are only a Morse-code station ID, like the one Nancy FD's channel sends every half
# hour. They are not transcribed and don't show in the call log or search.
hide_station_ids = true

[faster_whisper]
model = "large-v3-turbo"
device = "cuda"
# start-transcriber.bat finds the GTX 1070 Ti by name and gives Whisper only that card, so this is
# normally ignored. It's a fallback for when that fails; card numbers can differ between nvidia-smi
# and CUDA, so check the startup log says "Whisper uses the GTX 1070 Ti".
device_index = 0
# GTX 10-series (Pascal) cards can't run float16 fast. Use int8 (fastest) or float32.
compute_type = "int8"
vad_filter = true
# How sure the voice detector must be that a stretch is speech (0-1). Its own default, 0.5, threw away
# real radio speech whole and left calls blank; 0.2 keeps it and still drops tones and silence.
vad_threshold = 0.2
# Pauses shorter than this (ms) stay part of the speech around them.
vad_min_silence_ms = 300

[whisper_cpp]
# Start the server with e.g.: whisper-server -m models\ggml-large-v3-turbo.bin --port 8080
url = "http://127.0.0.1:8080/inference"

[codes]
# Local 10-codes, signals and call-sign numbering (see codes.example.csv). Edit codes.csv in Excel or
# Notepad; changes apply without a restart. Set to "" to turn codes off.
file = "codes.csv"
# Dispatch reads the time as "1346". A four-digit time within this many minutes of the call is
# written as 13:46, and so is the time at the end of a dispatch however Whisper wrote it ("Ops 1,
# 14-16"). 0 turns this off.
time_window_minutes = 3
# Write those times the 12-hour way ("1:46 PM").
twelve_hour = true

[corrections]
# Fixes you make with the Edit button on the call log page. Replaced words are learned here as
# heard -> correct and fixed in later calls; they are also given to Whisper as spelling hints. Edit or
# delete rows in Excel or Notepad; changes apply without a restart. Set to "" to turn this off.
file = "corrections.csv"

[places]
# Local streets, routes and landmarks (see places.example.csv). Build the full list for your area with
# fetch-places.bat, which downloads it from OpenStreetMap. Set to "" to turn places off.
file = "places.csv"
# Room for place names in Whisper's hint list, in characters. The whole hint list is about 800.
prompt_chars = 400
# Snap a misheard house number (or street) to a real address, using the house-number ranges that
# fetch-places.bat downloads from the US Census into address-ranges.json. Nothing changes without that file.
fix_addresses = true

# Which towns' streets to hint for talkgroups whose name doesn't say the town. Talkgroups named after
# a town ("Easton PD", "Bethlehem Fire") pick it up on their own. Keys match part of the talkgroup name.
[places.areas]
# "County Fire" = ["Palmer Township", "Forks Township", "Wilson"]

[hints]
# Street and unit names Whisper learns from the call log: incidents from the last hour, and the names
# each talkgroup says most. Nothing to keep up by hand. compare-hints.bat shows whether they help.
enabled = true
# Room for them in Whisper's hint list, in characters (the whole list is about 600). When the list is
# full, the places list and codes are dropped first; vocabulary.txt stays.
prompt_chars = 160
# Incidents with a call this recent count as going on now.
active_minutes = 60
# How far back "most heard" looks, and how many times a name must be heard to count.
history_days = 30
min_count = 3

[self_check]
# Spot transcripts that look garbled and run Whisper again on them, slower and more carefully, keeping the
# better of the two. The call log marks them "rechecked" (the retry came out clean) or "still unsure".
enabled = true
# What counts as garbled: Whisper's confidence below this, a street that isn't in places.csv, a fire or EMS
# unit whose station isn't in codes.csv, words going round in a loop, or far too many or too few words.
low_confidence = -0.8
streets = true
units = true
# Ask the Ollama model from [summaries] about calls Whisper was only middling sure of (needs [summaries]
# enabled; when Ollama is off, only the checks above run). It never rewrites the text.
ollama = true
ollama_below_confidence = -0.45
# The careful retry: a wider search and more tries. retry = false only marks the calls.
retry = true
retry_beam_size = 10

[speakers]
# Marks who is talking in each call: Dispatch, or a unit ("1781", "Medic 27"). SDRTrunk only sends the
# radio ID of some talkers, so it's read from the radio ID when there is one (radio IDs learn their
# call sign), else from how the call is worded. Calls with nothing to go on stay unmarked.
enabled = true
# Talkgroups (or part of their name) that only dispatch talks on.
dispatch_talkgroups = ["Countywide"]
# Police talkgroups: there a unit says its number first ("1770 County"), and the dispatcher says
# County first. On fire and EMS talkgroups it's the other way around ("County, 2851, responding").
police_talkgroups = ["PD", "Police", "Sheriff"]

[map]
# Possible incidents on a map at http://localhost:3000/map, from addresses heard in transcripts.
enabled = true
# Road shapes written by fetch-places.bat; needed to place intersections.
geo_file = "places-geo.json"
# Look up house-number addresses with OpenStreetMap's free search (one a second, answers are saved).
online_lookup = true
# Optional: your email, sent with lookups as OpenStreetMap asks.
contact_email = ""
# South, west, north, east: Easton to Allentown. Lookups outside this box are ignored.
area = [40.50, -75.62, 40.78, -75.17]
# Calls naming places within this distance, within this many minutes, are one incident.
incident_window_minutes = 45
incident_radius_m = 500
# Calls on these kinds of channel join the incident last sent there ("on TAC 2"), up to this long after
# its latest call. Ops channels carry many incidents at once, so they are left out.
follow_channels = ["Tac", "Fireground"]
channel_window_minutes = 60

[aircraft]
# Helicopters on the incident map, from an ADS-B receiver on your network (readsb, tar1090, ultrafeeder).
enabled = false
# The receiver's aircraft.json. Ultrafeeder serves it on port 8080.
url = "http://192.168.50.102:8080/data/aircraft.json"
poll_s = 5.0
# Show every helicopter. false = only aircraft on the watch list below.
all_helicopters = true
# Aircraft to always show and name. match is a tail number, flight callsign or ICAO hex code, and may
# end in * to match the start ("LIFE*").
# watch = [{match = "N123AB", name = "St. Luke's 1"}]
watch = []
# A helicopter this low (feet), within this many miles of an incident from the last incident_hours, is
# marked on the map as landing there.
landing_altitude_ft = 1500
landing_radius_miles = 1.0
incident_hours = 2.0
# Also send a phone alert when that happens (needs [alerts] set up).
alert_landing = false

[traffic]
# PennDOT crashes, road closures and roadwork, plus live traffic cameras, on the incident map. Read from
# the public 511PA website (no sign-up). Cameras are shown live only; PennDOT doesn't allow recording them.
enabled = false
# South, west, north, east. Empty = the same box as [map] area.
area = []
poll_s = 180.0
cameras = true
cameras_refresh_hours = 24.0
# A radio incident this many miles from a PennDOT crash or closure shows it in the incident list.
match_miles = 0.5

[alerts]
# Phone alerts through the ntfy app over Tailscale (see "Phone alerts" in the README).
enabled = false
# The topic name entered in the ntfy app. Letters, digits, - and _ only.
topic = "sdrtrunk-alerts"
# This PC's address as printed by `tailscale serve --bg 3000` and entered in the ntfy app.
base_url = ""
# An iPhone wake-up ping (just a random id) goes through here. "" = no ping; Android doesn't need it.
wakeup_url = "https://ntfy.sh"
# Incident types from the map that alert.
incidents = ["MVA", "Structure fire"]
# Tone-outs alert when the station name contains one of these, e.g. ["Station 4", "Easton"].
stations = []
# Watch zones: any call the map places within radius_miles of a spot alerts, whatever it is about, and so
# does a call naming a road that lies wholly inside the circle. prefix goes first in the alert's title.
# Give lat and lon, or an address to look up online once. One {...} per zone, e.g.
# zones = [{name = "Home", lat = 40.6915, lon = -75.2100, radius_miles = 0.5, prefix = "DRONE LAUNCH REQUESTED"}]
zones = []
# Calls and tone-outs older than this don't alert.
max_age_minutes = 15
# Bark iPhone app (see "Bark instead" in the README). The device key from Bark's push address.
bark_key = ""
bark_server = "https://api.day.app"
# The key set in Bark's Push Encryption settings (32 characters for AES256), and its mode (GCM or CBC).
bark_encryption_key = ""
bark_encryption_mode = "GCM"

[summaries]
# Short summaries and tags for incidents and long calls, written by Ollama on this PC (see "Call summaries"
# in the README). Start Ollama with start-ollama.bat first.
enabled = false
url = "http://127.0.0.1:11434"
model = "qwen2.5:7b"
# Calls with at least this many words also get a one-line summary on the call log. 0 = incidents only.
call_min_words = 25
# Wait this long after a call joins an incident, so a burst of calls is summarized together.
delay_s = 20
# Incident summaries are kept to about this many words.
incident_words = 40

[tones]
# Finds two-tone pages in call recordings, for P25 talkgroups SDRTrunk's paging decoder can't hear.
enabled = true
# Station names, tone_a,tone_b,name per line (same format as SDRTrunk's paging_tones.csv).
file = "paging_tones.csv"
# Only check calls whose talkgroup name or number contains one of these, e.g. ["Fire Dispatch"]. [] = all.
talkgroups = []
# Name unlisted tones by themselves from the station dispatch names right after them (see the README).
learn = true
learn_min_seen = 3
learn_share = 0.5
learn_days = 30

[signal]
# SDRTrunk sends each dongle's signal quality every hour: share of messages decoded, time the control channel
# lost sync, signal and noise levels, frequency drift and USB errors. It also writes them to
# signal_quality.csv in SDRTrunk's logs folder and shows the last hour in its Tuners tab.
enabled = true
# Phone alert (needs [alerts] set up) when a dongle gets worse than its own normal, once until it clears.
alert = true
# "Normal" is the median of the hours this far back, after at least min_history_hours of history.
baseline_days = 7.0
min_history_hours = 6
# Alert when: decoding drops this many points, a control channel loses sync this many minutes in an hour,
# the signal on calls is this many dB weaker or the noise this many dB higher, the frequency correction moves
# ppm_jump in an hour or sits ppm_drift from normal, or there are this many USB errors in an hour.
decode_drop_points = 15.0
sync_lost_minutes = 2.0
signal_drop_db = 10.0
noise_rise_db = 10.0
ppm_jump = 1.0
ppm_drift = 2.0
usb_errors = 5
keep_days = 90

[watchdog]
# start-everything.bat starts Ollama (when [summaries] is on), the transcriber and SDRTrunk, and restarts
# any of them that crashes or freezes (see "Auto-restart" in the README).
# SDRTrunk's sdr-trunk.bat, e.g. 'E:\SDR\sdr-trunk\bin\sdr-trunk.bat'. Empty = wherever a running
# SDRTrunk was started from.
sdrtrunk = ""
# Look at each program this often (seconds), and restart one after this many checks in a row fail.
check_s = 30
fail_checks = 4
# Give a program this long to start (seconds) before checking it.
startup_s = 180
# A program restarted this many times in an hour is left alone for an hour, with one phone alert.
max_restarts_per_hour = 4
# Phone alert (Bark, from [alerts]) on each restart.
alert = true

[recordings]
# Call audio in the data folder is deleted after this many days, so it doesn't fill the disk. Audio of
# calls on an incident, and calls that sent a phone alert, is always kept. Only the sound is deleted:
# the call and its transcript stay in the call log. 0 = don't delete by age.
max_age_days = 7
# When all call audio together is over this size, the oldest is deleted first (same calls kept as above).
# 0 = no size limit.
max_total_gb = 1.0
# How often to check, in minutes.
check_minutes = 60
