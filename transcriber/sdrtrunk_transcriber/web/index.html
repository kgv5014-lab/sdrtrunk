<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDRTrunk call log</title>
<style>
  :root { --bg: #fafafa; --fg: #1d1d1f; --muted: #6b6b70; --line: #e2e2e6; --card: #fff; --accent: #2a6fdb; --warn: #b26a00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161618; --fg: #ececf0; --muted: #9a9aa2; --line: #2c2c31; --card: #1e1e22; --accent: #6ea2ff; --warn: #f0a640; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, sans-serif; }
  header { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  h1 { font-size: 16px; margin: 0 12px 0 0; }
  header a { color: var(--accent); margin-right: 8px; }
  input { background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; }
  #q { flex: 1 1 220px; }
  #status { color: var(--muted); font-size: 12px; margin-left: auto; }
  main { padding: 8px 16px 32px; }
  .call { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 8px 0; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 12px; align-items: center; }
  .meta b { color: var(--fg); font-weight: 600; }
  .text { margin-top: 6px; font-size: 15px; white-space: pre-wrap; }
  .text.pending, .text.none { color: var(--muted); font-style: italic; }
  .text.failed { color: var(--warn); }
  .low { color: var(--warn); }
  .codes { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 6px; }
  .tag { font-size: 12px; border: 1px solid var(--line); border-radius: 10px; padding: 1px 8px; color: var(--muted); }
  .tag b { color: var(--accent); font-weight: 600; margin-right: 4px; }
  .summary { margin-top: 6px; color: var(--muted); }
  .summary .ai { font-size: 10px; font-weight: 700; letter-spacing: 0.04em; border: 1px solid var(--line); border-radius: 6px; padding: 0 4px; margin-right: 5px; vertical-align: 1px; }
  audio { height: 28px; max-width: 100%; }
  button { background: none; border: 1px solid var(--line); color: var(--accent); border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
  .page { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--warn); border-radius: 8px; padding: 8px 12px; margin: 8px 0; }
  .page .title { font-size: 15px; font-weight: 600; }
  .page .title .unknown { color: var(--muted); font-weight: 400; }
  .edit { margin-left: auto; padding: 2px 10px; font-size: 12px; }
  .fixed { color: var(--accent); }
  .first { color: var(--muted); font-size: 13px; margin-top: 2px; }
  textarea { width: 100%; margin-top: 6px; background: var(--bg); color: var(--fg); border: 1px solid var(--accent); border-radius: 6px; padding: 6px 8px; font: 15px/1.45 system-ui, sans-serif; resize: vertical; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; }
  .note { color: var(--muted); font-size: 12px; }
  .note a { color: var(--accent); cursor: pointer; margin-left: 4px; }
  #more { display: block; margin: 16px auto; }
  #more[hidden] { display: none; }
</style>
</head>
<body>
<header>
  <h1>Call log</h1>
  <a href="map">Incident map</a>
  <a href="units">Units</a>
  <input id="q" type="search" placeholder="Search transcripts">
  <input id="talkgroup" type="search" placeholder="Talkgroup" size="12">
  <input id="source" type="search" placeholder="Radio ID or alias" size="14">
  <span id="status"></span>
</header>
<main>
  <div id="calls"></div>
  <button id="more" hidden>Older calls</button>
</main>
<script>
const $ = id => document.getElementById(id);
let oldestId = null;
let timer = null;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}

function render(call) {
  const card = el('div', 'call');
  const meta = el('div', 'meta');
  const when = new Date(call.call_time * 1000);
  meta.append(el('span', '', when.toLocaleString()));
  const tg = el('span'); tg.append('TG ', el('b', '', call.talkgroup_label || call.talkgroup));
  if (call.talkgroup_label) tg.append(' (' + call.talkgroup + ')');
  meta.append(tg);
  const src = el('span'); src.append('From ', el('b', '', call.talker_alias || call.source || 'unknown'));
  if (call.talker_alias && call.source) src.append(' (' + call.source + ')');
  meta.append(src);
  if (call.system_label) meta.append(el('span', '', call.system_label));
  if (call.frequency) meta.append(el('span', '', (call.frequency / 1e6).toFixed(4) + ' MHz'));
  if (call.duration_s) meta.append(el('span', '', call.duration_s.toFixed(1) + ' s'));
  if (call.check_status === 'unsure') meta.append(el('span', 'low', 'still unsure: ' + (call.check_notes || 'looks garbled')));
  else if (call.check_status !== 'rechecked' && call.confidence !== null && call.confidence < -0.8) meta.append(el('span', 'low', 'low confidence'));
  if (call.check_status === 'rechecked') meta.append(el('span', 'fixed', 'rechecked'));
  if (call.corrected_at) meta.append(el('span', 'fixed', 'fixed by hand'));
  if (call.address_fix && !call.corrected_at) meta.append(el('span', 'fixed', 'address fixed, heard as ' + call.address_fix));
  if (call.audio_deleted_at) meta.append(el('span', '', 'audio deleted'));
  else {
    const player = el('audio'); player.controls = true; player.preload = 'none';
    player.src = 'api/calls/' + call.id + '/audio';
    meta.append(player);
  }
  if (['done', 'skipped', 'failed'].includes(call.status)) {
    const edit = el('button', 'edit', 'Edit');
    edit.addEventListener('click', () => startEdit(card, call));
    meta.append(edit);
  }
  card.append(meta);

  let text, cls = 'text';
  if (call.status === 'done') { text = call.transcript || (call.error === 'tones only' ? 'tones only, no speech' : 'no speech found'); if (!call.transcript) cls += ' none'; }
  else if (call.status === 'skipped') { text = 'not transcribed (' + (call.error || 'skipped') + ')'; cls += ' none'; }
  else if (call.status === 'failed') { text = 'transcription failed: ' + (call.error || ''); cls += ' failed'; }
  else { text = call.status + '...'; cls += ' pending'; }
  card.append(el('div', cls, text));
  // The self-check ran Whisper again and kept the second try; the first is shown for comparison.
  if (call.first_transcript && call.status === 'done') card.append(el('div', 'first', 'first try: ' + call.first_transcript));
  if (call.summary) {
    const sum = el('div', 'summary');
    sum.append(el('span', 'ai', 'AI'), call.summary + (call.summary_tags && call.summary_tags.length ? ' · ' + call.summary_tags.join(', ') : ''));
    card.append(sum);
  }
  if (call.codes && call.codes.length) {
    const tags = el('div', 'codes');
    call.codes.forEach(c => { const t = el('span', 'tag'); t.append(el('b', '', c.code), c.meaning); tags.append(t); });
    card.append(tags);
  }
  return card;
}

// Editing a transcript: the fix is saved, and replaced words are learned for later calls.
let editing = 0;

function startEdit(card, call) {
  if (card.querySelector('textarea')) return;
  editing++;
  const shown = card.querySelector('.text');
  const box = el('textarea');
  box.value = call.status === 'done' ? (call.transcript || '') : '';
  box.rows = Math.max(2, Math.ceil(box.value.length / 80));
  const actions = el('div', 'actions');
  const save = el('button', '', 'Save');
  const cancel = el('button', '', 'Cancel');
  actions.append(save, cancel, el('span', 'note', 'Words you replace are fixed in later calls too.'));
  shown.replaceWith(box);
  box.after(actions);
  box.focus();
  const done = () => { editing = Math.max(0, editing - 1); };
  cancel.addEventListener('click', () => { box.replaceWith(shown); actions.remove(); done(); });
  save.addEventListener('click', async () => {
    save.disabled = true;
    try {
      const res = await fetch('api/calls/' + call.id + '/transcript', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: box.value }) });
      if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
      const result = await res.json();
      call.transcript = result.transcript; call.status = 'done'; call.corrected_at = Date.now() / 1000;
      const fresh = render(call);
      card.replaceWith(fresh);
      if (result.learned.length) showLearned(fresh, result.learned);
      else done();
    } catch (e) {
      save.disabled = false;
      actions.querySelector('.note').textContent = 'Not saved: ' + e.message;
    }
  });
}

// Lists what was learned, with Undo for each, and holds the list still for a few seconds.
function showLearned(card, learned) {
  const note = el('div', 'note');
  note.append('Learned: ');
  learned.forEach((c, i) => {
    if (i) note.append(', ');
    note.append(c.heard + ' \u2192 ' + c.correct);
    const undo = el('a', '', 'Undo');
    undo.addEventListener('click', async () => {
      const res = await fetch('api/corrections/forget', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ heard: c.heard, correct: c.correct }) });
      undo.replaceWith(res.ok ? ' (undone)' : ' (could not undo)');
    });
    note.append(undo);
  });
  card.append(note);
  setTimeout(() => { editing = Math.max(0, editing - 1); }, 15000);
}

function hz(value) { return value.toFixed(1) + ' Hz'; }

function renderPage(page) {
  const card = el('div', 'page');
  const title = el('div', 'title');
  const tones = page.tone_b ? hz(page.tone_a) + ' + ' + hz(page.tone_b) : hz(page.tone_a) + ' long tone';
  if (page.label) title.append('Tone out: ' + page.label);
  else title.append('Tone out: ', el('span', 'unknown', 'not on the station list'));
  card.append(title);
  const meta = el('div', 'meta');
  meta.append(el('span', '', new Date(page.page_time * 1000).toLocaleString()));
  meta.append(el('b', '', tones));
  if (page.channel) meta.append(el('span', '', page.channel));
  if (page.system_label) meta.append(el('span', '', page.system_label));
  if (page.frequency) meta.append(el('span', '', (page.frequency / 1e6).toFixed(4) + ' MHz'));
  card.append(meta);
  return card;
}

// Tone-out pages are shown between the calls, by time. Talkgroup and radio filters hide them.
async function loadPages(since, until) {
  if ($('talkgroup').value || $('source').value) return [];
  const p = new URLSearchParams({ q: $('q').value, limit: 500 });
  if (since !== null) p.set('since', since);
  if (until !== null) p.set('until', until);
  try { return await (await fetch('api/pages?' + p)).json(); } catch (e) { return []; }
}

function params(beforeId) {
  const p = new URLSearchParams({ q: $('q').value, talkgroup: $('talkgroup').value, source: $('source').value, limit: 100 });
  if (beforeId) p.set('before_id', beforeId);
  return p;
}

let oldestTime = null;

async function load(append) {
  const res = await fetch('api/calls?' + params(append ? oldestId : null));
  const calls = await res.json();
  const full = calls.length >= 100;
  // Pages from the oldest call shown up to the previous oldest (or now); all of them once no older calls remain.
  const since = full ? calls[calls.length - 1].call_time : null;
  const pages = await loadPages(since, append ? oldestTime : null);
  const items = calls.map(c => ({ time: c.call_time, node: () => render(c) }))
    .concat(pages.map(p => ({ time: p.page_time, node: () => renderPage(p) })))
    .sort((a, b) => b.time - a.time);
  const list = $('calls');
  if (!append) list.replaceChildren();
  items.forEach(item => list.append(item.node()));
  if (calls.length) oldestId = calls[calls.length - 1].id;
  oldestTime = since;
  $('more').hidden = !full;
}

async function refreshStatus() {
  try {
    const s = await (await fetch('api/status')).json();
    const c = s.calls;
    $('status').textContent = `${s.backend}${s.backend_ready ? '' : ' (loading model)'} · queue ${s.queue} · ` +
      `${c.done || 0} done, ${c.skipped || 0} skipped, ${c.failed || 0} failed`;
  } catch (e) { $('status').textContent = 'service unreachable'; }
}

// Refreshing rebuilds the list, so skip it while a clip plays or the user has scrolled down.
function playing() { return [...document.querySelectorAll('audio')].some(a => !a.paused); }

async function tick() {
  await refreshStatus();
  if (!playing() && !editing && window.scrollY < 200) await load(false);
}

['q', 'talkgroup', 'source'].forEach(id => $(id).addEventListener('input', () => {
  clearTimeout(timer); timer = setTimeout(() => load(false), 250);
}));
$('more').addEventListener('click', () => load(true));
tick();
setInterval(tick, 5000);
</script>
</body>
</html>
