<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incident dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --bg: #fafafa; --fg: #1d1d1f; --muted: #6b6b70; --line: #e2e2e6; --card: #fff; --accent: #2a6fdb; --warn: #b26a00;
          --fire: #d33c2f; --ems: #1f8a5b; --police: #2a6fdb; --mva: #e07b00; --other: #7a7a82; --mark: #ffe08a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161618; --fg: #ececf0; --muted: #9a9aa2; --line: #2c2c31; --card: #1e1e22; --accent: #6ea2ff; --warn: #f0a640;
            --fire: #ff6b5e; --ems: #4cc38a; --police: #6ea2ff; --mva: #ffa13d; --other: #a0a0a8; --mark: #6b5310; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, sans-serif; display: flex; flex-direction: column; }
  header { background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  h1 { font-size: 16px; margin: 0; }
  a { color: var(--accent); }
  select, button { background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; }
  button { color: var(--accent); cursor: pointer; }
  label { color: var(--muted); font-size: 13px; }
  #status { color: var(--muted); font-size: 12px; margin-left: auto; }
  .body { flex: 1; display: flex; min-height: 0; }
  #list { width: 320px; overflow-y: auto; border-right: 1px solid var(--line); padding: 8px; }
  #map { flex: 1; min-height: 300px; }
  #feed { width: 380px; overflow-y: auto; border-left: 1px solid var(--line); padding: 8px; }
  #feed h2, #list h2 { font-size: 13px; color: var(--muted); margin: 2px 2px 8px; font-weight: 600; }
  .tabs { display: none; }
  /* Narrow screens: one part at a time, picked with tabs. */
  @media (max-width: 1100px) {
    .tabs { display: flex; border-bottom: 1px solid var(--line); }
    .tabs button { flex: 1; border: 0; border-radius: 0; padding: 8px; color: var(--muted); background: var(--bg); }
    .tabs button.on { color: var(--accent); box-shadow: 0 -2px 0 var(--accent) inset; }
    #list, #feed { width: auto; flex: 1; border: 0; }
    .body > :not(.shown) { display: none; }
    /* An open popup fills a phone screen; the zoom and layer buttons would cover its close X. */
    #map.popup-open .leaflet-top { display: none; }
    #map .leaflet-popup-content { max-width: calc(100vw - 80px); }
  }
  .feed-call { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; margin: 0 0 7px; }
  .feed-call.in-incident { border-left: 4px solid var(--accent); }
  .feed-call .text { margin-top: 3px; white-space: pre-wrap; }
  .feed-call .text.none { color: var(--muted); font-style: italic; }
  .feed-call audio { width: 100%; height: 28px; margin-top: 4px; }
  .feed-page { border: 1px solid var(--line); border-left: 4px solid var(--warn); border-radius: 8px; padding: 6px 9px; margin: 0 0 7px; color: var(--warn); font-weight: 600; background: var(--card); }
  .row { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; margin-top: 4px; }
  .row button { font-size: 12px; padding: 2px 8px; }
  textarea.fix-text { width: 100%; margin-top: 4px; background: var(--bg); color: var(--fg); border: 1px solid var(--accent); border-radius: 6px; padding: 5px 7px; font: inherit; resize: vertical; }
  .fixed { color: var(--accent); }
  .item { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--other); border-radius: 8px; padding: 8px 10px; margin: 0 0 8px; cursor: pointer; }
  .item.hidden-item { opacity: 0.55; }
  .item .where { font-weight: 600; }
  .muted { color: var(--muted); font-size: 12px; }
  .empty { color: var(--muted); padding: 12px; }
  .pop { max-width: 360px; }
  .pop .where { font-size: 15px; font-weight: 600; }
  .pop .call { border-top: 1px solid #ddd; padding-top: 6px; margin-top: 6px; }
  .pop audio { width: 100%; height: 28px; margin-top: 4px; }
  .pop .tags { display: flex; flex-wrap: wrap; gap: 3px 5px; margin-top: 4px; }
  .pop .tag { font-size: 11px; border: 1px solid #ccc; border-radius: 10px; padding: 0 6px; color: #555; }
  .pop .page { color: #9a5800; font-weight: 600; }
  .pop .actions { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .pop .fix { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px; }
  .pop .fix button, .pop .fix select, .pop .actions select { font-size: 12px; padding: 2px 6px; }
  .pop select { max-width: 100%; }
  .channel { color: var(--accent); font-weight: 600; }
  .svc { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.03em; color: #fff; border-radius: 8px; padding: 0 6px; margin-right: 3px; vertical-align: 1px; }
  .svc.police { background: var(--police); } .svc.fire { background: var(--fire); } .svc.ems { background: var(--ems); }
  .types { display: flex; flex-wrap: wrap; gap: 4px; }
  .types label { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 14px; padding: 2px 9px 2px 6px; color: var(--fg); cursor: pointer; user-select: none; }
  .types label:has(input:not(:checked)) { opacity: 0.45; }
  .types input { margin: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .new-badge { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; color: #fff; background: var(--fire); border-radius: 8px; padding: 0 6px; margin-right: 6px; vertical-align: 1px; }
  .item.new { box-shadow: 0 0 0 2px var(--accent) inset; }
  .mva-text { color: var(--mva); font-weight: 600; }
  .summary { margin: 4px 0; }
  .summary .ai { font-size: 10px; font-weight: 700; letter-spacing: 0.04em; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 4px; margin-right: 5px; vertical-align: 1px; }
  .summary.stale { opacity: 0.7; }
  .item .summary { font-size: 13px; }
  .stags { display: flex; flex-wrap: wrap; gap: 3px 5px; margin-top: 3px; }
  .heli { font-size: 20px; line-height: 20px; text-align: center; filter: drop-shadow(0 0 2px #fff); }
  .heli.medical { filter: drop-shadow(0 0 3px #d33c2f); }
  .heli-label { font-size: 11px; font-weight: 600; padding: 0 4px; }
  .heli-note { color: var(--fire); font-weight: 600; }
  .road { font-size: 17px; line-height: 20px; text-align: center; filter: drop-shadow(0 0 2px #fff); }
  .road.major { font-size: 21px; }
  .cam { font-size: 14px; line-height: 18px; text-align: center; filter: drop-shadow(0 0 2px #fff); }
  .road-note { color: var(--mva); font-weight: 600; font-size: 13px; }
  .pop .credit { font-size: 11px; color: #777; margin-top: 6px; }
  .pop .camera img { width: 100%; max-width: 360px; aspect-ratio: 4 / 3; background: #222; border-radius: 4px; display: block; }
  .pop .camera .actions { margin-top: 6px; }
  .pop .cams { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .pop .cams button { font-size: 12px; padding: 2px 6px; }
  .stag { font-size: 11px; border: 1px solid var(--line); border-radius: 10px; padding: 0 6px; color: var(--muted); }
  .stag.status { color: var(--accent); border-color: var(--accent); }
  .pop mark { background: var(--mark); color: inherit; padding: 0 2px; border-radius: 3px; }
  .pulse { animation: pulse 1.4s ease-out infinite; }
  @keyframes pulse { 0% { stroke-width: 2; stroke-opacity: 1; } 100% { stroke-width: 18; stroke-opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; stroke-width: 5; } }
  .notice { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--warn); border-radius: 8px; padding: 8px 10px; margin: 0 0 8px; }
</style>
</head>
<body>
<header>
  <h1>Incident map</h1>
  <a href="./">Call log</a>
  <a href="units">Units</a>
  <select id="range" title="Time range">
    <option value="3600">Last hour</option>
    <option value="21600">Last 6 hours</option>
    <option value="today">Today</option>
    <option value="86400">Last 24 hours</option>
    <option value="week">This week</option>
    <option value="2592000">Last 30 days</option>
  </select>
  <div class="types" id="types"></div>
  <label title="Only incidents that more than one of police, fire and EMS were sent to"><input type="checkbox" id="multi"> Several services</label>
  <label><input type="checkbox" id="hidden"> Show removed</label>
  <button id="seen" hidden>Mark all seen</button>
  <span id="status"></span>
</header>
<div class="tabs" id="tabs">
  <button data-pane="list">Incidents</button><button data-pane="map">Map</button><button data-pane="feed">Live calls</button>
</div>
<div class="body">
  <div id="list"><h2>Incidents</h2></div>
  <div id="map"></div>
  <div id="feed"><h2>Live calls</h2><div id="feed-items"></div></div>
</div>
<script>
const $ = id => document.getElementById(id);
const COLORS = () => {
  const s = getComputedStyle(document.documentElement);
  return { fire: s.getPropertyValue('--fire'), ems: s.getPropertyValue('--ems'),
           police: s.getPropertyValue('--police'), mva: s.getPropertyValue('--mva'), other: s.getPropertyValue('--other') };
};
const NAMES = { fire: 'Fire', ems: 'EMS', police: 'Police' };
const TYPES = [['fire', 'Fire'], ['ems', 'EMS'], ['police', 'Police'], ['mva', 'MVA'], ['other', 'Other']];

// Per-browser settings: which types are shown, and which incidents have been seen.
function stored(key, fallback) { try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch (e) { return fallback; } }
function store(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* private window */ } }
let shownTypes = new Set(stored('map.types', TYPES.map(t => t[0])));
let seenUpTo = stored('map.seenUpTo', null);   // incidents with a bigger id are new
let seenIds = new Set(stored('map.seenIds', []));
let lastIncidents = [];
let items = {};
function isNew(incident) { return seenUpTo !== null && incident.id > seenUpTo && !seenIds.has(incident.id); }
function markSeen(incident) {
  if (!isNew(incident)) return;
  seenIds.add(incident.id);
  store('map.seenIds', [...seenIds].slice(-500));
  // Update in place: re-rendering would close the open popup.
  const marker = markers[incident.id];
  if (marker && marker._path) marker._path.classList.remove('pulse');
  const item = items[incident.id];
  if (item) { item.classList.remove('new'); item.querySelector('.new-badge')?.remove(); }
  const fresh = lastIncidents.filter(isNew).length;
  document.title = (fresh ? '(' + fresh + ') ' : '') + 'Incident map';
  $('seen').hidden = !fresh;
}
const PRECISION = { address: 'house address', intersection: 'intersection', landmark: 'landmark',
                    street: 'street only, approximate',
                    'follow-up': 'follow-up, same unit', channel: 'same Tac channel', 'same-street': 'names its street',
                    'other-service': 'another service sent to its street',
                    manual: 'moved here by hand' };

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}

const map = L.map('map', { zoomControl: true });
const layer = L.layerGroup().addTo(map);
let markers = {};
let fitted = false;
let popupOpen = false;
map.on('popupopen', () => { popupOpen = true; map.getContainer().classList.add('popup-open'); });
map.on('popupclose', () => { popupOpen = false; map.getContainer().classList.remove('popup-open'); });
map.on('resize', () => {
  Object.values(markers).forEach(m => { const p = m.getPopup(); if (p) p.options.maxHeight = popupHeight(); });
});

function time(t) { return new Date(t * 1000).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); }
function clock(t) { return new Date(t * 1000).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }

// The transcript with the words that set the incident type ("MVA", "structure fire") highlighted.
function highlighted(text, spans) {
  const box = el('div');
  if (!text) { box.append(el('span', 'muted', 'no transcript')); return box; }
  let at = 0;
  (spans || []).forEach(([start, end]) => { box.append(text.slice(at, start), el('mark', '', text.slice(start, end))); at = end; });
  box.append(text.slice(at));
  return box;
}

// Small Police / Fire / EMS tags for the services working an incident.
function services(incident) {
  const box = el('span');
  (incident.services || []).forEach(s => box.append(el('span', 'svc ' + s, NAMES[s])));
  return box;
}

function describe(incident) {
  const box = el('span');
  const parts = [NAMES[incident.category], incident.nature].filter(Boolean);
  parts.forEach((part, i) => {
    if (i) box.append(' · ');
    box.append(part === 'MVA' ? el('span', 'mva-text', 'MVA') : part);
  });
  return box;
}

// The Ollama summary and tags, when [summaries] is turned on.
function summary(incident, withTags) {
  const box = el('div', 'summary' + (incident.summary_current === false ? ' stale' : ''));
  box.append(el('span', 'ai', 'AI'), incident.summary);
  if (incident.summary_current === false) box.title = 'Being updated with the latest calls';
  const tags = [...(incident.summary_tags || [])];
  if (withTags && (tags.length || incident.summary_status)) {
    const row = el('div', 'stags');
    if (incident.summary_status && incident.summary_status !== 'unknown') row.append(el('span', 'stag status', incident.summary_status));
    tags.forEach(t => row.append(el('span', 'stag', t)));
    box.append(row);
  }
  return box;
}

function popup(incident) {
  const box = el('div', 'pop');
  box.append(el('div', 'where', incident.label || 'Unknown place'));
  if (incident.category || incident.nature) { const what = el('div'); what.append(describe(incident)); box.append(what); }
  if ((incident.services || []).length) { const svc = el('div'); svc.append(services(incident)); box.append(svc); }
  if (incident.summary) box.append(summary(incident, true));
  const span = incident.first_time === incident.last_time ? time(incident.first_time)
    : time(incident.first_time) + ' – ' + clock(incident.last_time);
  box.append(el('div', 'muted', span + ' · ' + incident.calls.length + ' call' + (incident.calls.length === 1 ? '' : 's')));
  if (incident.channel) box.append(el('div', 'channel', 'Working on ' + incident.channel));
  const road = roadEventsAt(incident);
  if (road) box.append(el('div', 'road-note', road));
  const cams = cameraButtons(incident.lat, incident.lon);
  if (cams) box.append(cams);
  incident.pages.forEach(p => {
    const tones = p.tone_b ? p.tone_a.toFixed(1) + ' + ' + p.tone_b.toFixed(1) + ' Hz' : p.tone_a.toFixed(1) + ' Hz long tone';
    box.append(el('div', 'page', 'Tone out ' + clock(p.page_time) + ': ' + (p.label || 'not on the station list') + ' (' + tones + ')'));
  });
  incident.calls.forEach(c => {
    const call = el('div', 'call');
    call.append(el('div', 'muted', clock(c.call_time) + ' · ' + (c.talkgroup_label || c.talkgroup) +
      (c.talker_alias ? ' · ' + c.talker_alias : c.speaker_kind ? ' · ' + c.speaker : '') + ' · ' + (PRECISION[c.precision] || c.precision)));
    const text = highlighted(c.transcript, c.highlights);
    call.append(text);
    if (c.codes && c.codes.length) {
      const tags = el('div', 'tags');
      c.codes.forEach(code => tags.append(el('span', 'tag', code.code + ' ' + code.meaning)));
      call.append(tags);
    }
    const audio = el('audio'); audio.controls = true; audio.preload = 'none'; audio.src = 'api/calls/' + c.id + '/audio';
    call.append(audio);
    const fix = fixCall(incident, c);
    const edit = el('button', '', 'Edit');
    edit.title = 'Fix the words; replaced words are fixed in later calls too';
    edit.onclick = () => editTranscript(call, text, c, () => { needsReload = true; });
    fix.prepend(edit);
    call.append(fix);
    box.append(call);
  });
  const actions = el('div', 'actions');
  const btn = el('button', '', incident.hidden ? 'Put back on the map' : 'Remove from map');
  btn.onclick = async () => {
    await fetch('api/incidents/' + incident.id + (incident.hidden ? '/restore' : ''), { method: incident.hidden ? 'POST' : 'DELETE' });
    map.closePopup();
    load();
  };
  actions.append(btn);
  const others = otherIncidents(incident);
  if (others.length) {
    const merge = choose('Merge into…', others);
    merge.onchange = () => merge.value && edit('api/incidents/' + incident.id + '/merge', 'POST', { into: Number(merge.value) });
    actions.append(merge);
  }
  box.append(actions);
  return box;
}

// Other incidents close in time, nearest in time first, to move a call to or merge with.
function otherIncidents(incident) {
  return lastIncidents.filter(i => i.id !== incident.id && Math.abs(i.first_time - incident.first_time) <= 6 * 3600)
    .sort((a, b) => Math.abs(a.first_time - incident.first_time) - Math.abs(b.first_time - incident.first_time))
    .slice(0, 25);
}

function choose(prompt, incidents) {
  const select = el('select');
  select.append(new Option(prompt, ''));
  incidents.forEach(i => select.append(new Option(clock(i.first_time) + ' · ' + (i.label || 'Unknown place') +
    (i.nature ? ' · ' + i.nature : ''), i.id)));
  return select;
}

// Buttons under each call to fix which incident it is in.
function fixCall(incident, c) {
  const box = el('div', 'fix');
  const others = otherIncidents(incident);
  if (others.length) {
    const move = choose('Move to…', others);
    move.onchange = () => move.value && edit('api/calls/' + c.id + '/move', 'POST', { incident_id: Number(move.value) });
    box.append(move);
  }
  if (incident.calls.length > 1) {
    const split = el('button', '', 'Own incident');
    split.title = 'Take this call out into an incident of its own';
    split.onclick = () => edit('api/calls/' + c.id + '/split', 'POST');
    box.append(split);
  }
  const remove = el('button', '', 'Not an incident');
  remove.title = 'Take this call off the map';
  remove.onclick = () => edit('api/calls/' + c.id + '/place', 'DELETE');
  box.append(remove);
  return box;
}

async function edit(url, method, body) {
  try {
    const r = await fetch(url, { method, headers: body ? { 'Content-Type': 'application/json' } : {},
                                 body: body ? JSON.stringify(body) : undefined });
    if (!r.ok) throw new Error((await r.json()).detail || r.status);
  } catch (e) { $('status').textContent = 'Could not change that: ' + e.message; }
  map.closePopup();
  load();
}

function popupHeight() { return Math.max(160, map.getSize().y - 80); }

function render(incidents) {
  lastIncidents = incidents;
  if (seenUpTo === null) {
    // First visit: nothing counts as new until the next incident arrives.
    seenUpTo = incidents.reduce((m, i) => Math.max(m, i.id), 0);
    store('map.seenUpTo', seenUpTo);
  }
  const colors = COLORS();
  layer.clearLayers();
  markers = {};
  items = {};
  const list = $('list');
  list.querySelectorAll('.item, .empty').forEach(n => n.remove());
  const shown = incidents.filter(i => shownTypes.has(i.type || 'other') && (!$('multi').checked || (i.services || []).length > 1));
  const fresh = incidents.filter(isNew);
  document.title = (fresh.length ? '(' + fresh.length + ') ' : '') + 'Incident map';
  $('seen').hidden = !fresh.length;
  if (!shown.length) list.append(el('div', 'empty', incidents.length ? 'No incidents of the ticked types in this time range.'
    : 'No incidents in this time range yet. They appear when a transcript names an address or intersection.'));
  const bounds = [];
  // Oldest first on the map so the newest dot is drawn on top; the list stays newest first.
  [...shown].reverse().forEach(incident => {
    const color = colors[incident.type] || colors.other;
    const neu = isNew(incident);
    const marker = L.circleMarker([incident.lat, incident.lon], {
      radius: Math.min(16, 7 + 2 * Math.log2(incident.calls.length)), color, weight: 2,
      fillColor: color, fillOpacity: incident.hidden ? 0.15 : 0.55, className: neu ? 'pulse' : '',
    }).addTo(layer);
    // Never taller than the map, so the close button stays on screen; long incidents scroll inside.
    marker.bindPopup(() => popup(incident), { maxWidth: 380, maxHeight: popupHeight(), autoPanPadding: [16, 16],
                                               keepInView: true });
    marker.on('popupopen', () => setTimeout(() => markSeen(incident), 1500));
    marker.bindTooltip(incident.label || '');
    markers[incident.id] = marker;
    bounds.push([incident.lat, incident.lon]);
  });
  shown.forEach(incident => {
    const color = colors[incident.type] || colors.other;
    const item = el('div', 'item' + (incident.hidden ? ' hidden-item' : '') + (isNew(incident) ? ' new' : ''));
    item.style.borderLeftColor = color;
    const where = el('div', 'where');
    if (isNew(incident)) where.append(el('span', 'new-badge', 'NEW'));
    where.append(incident.label || 'Unknown place');
    item.append(where);
    const meta = el('div', 'muted', time(incident.last_time) + ' · ');
    if ((incident.services || []).length > 1) meta.append(services(incident));
    if (incident.category || incident.nature) meta.append(describe(incident), ' · ');
    meta.append(incident.calls.length + ' call' + (incident.calls.length === 1 ? '' : 's'));
    if (incident.channel) meta.append(' · ', el('span', 'channel', incident.channel));
    item.append(meta);
    const heli = helicoptersAt(incident.id);
    if (heli) item.append(el('div', 'heli-note', heli));
    const road = roadEventsAt(incident);
    if (road) item.append(el('div', 'road-note', road));
    if (incident.summary) item.append(summary(incident, false));
    items[incident.id] = item;
    item.onclick = () => { pick('map'); map.setView([incident.lat, incident.lon], Math.max(map.getZoom(), 15)); markers[incident.id].openPopup(); };
    list.append(item);
  });
  if (!fitted && bounds.length) { map.fitBounds(bounds, { padding: [40, 40], maxZoom: 15 }); fitted = true; }
}

// ---- helicopters from the ADS-B receiver ([aircraft] in config.toml)
const aircraftLayer = L.layerGroup().addTo(map);
const aircraftMarkers = {};
let aircraft = [];

function aircraftName(a) { return a.name || a.flight || a.reg || a.hex; }

function helicoptersAt(incidentId) {
  const here = aircraft.filter(a => a.near && a.near.incident_id === incidentId);
  if (!here.length) return '';
  return '🚁 ' + here.map(a => aircraftName(a) + (a.near.landing ? ' landing' : ' nearby')).join(', ');
}

function aircraftText(a) {
  const lines = [aircraftName(a) + (a.type ? ' · ' + a.type : '')];
  if (a.operator) lines.push(a.operator);
  if (a.desc) lines.push(a.desc);
  lines.push((a.alt_ft === null ? '? ft' : a.alt_ft === 0 ? 'on the ground' : a.alt_ft.toLocaleString() + ' ft')
             + (a.speed_kt != null ? ' · ' + Math.round(a.speed_kt) + ' kt' : ''));
  if (a.near) lines.push((a.near.landing ? 'Coming down ' : '') + a.near.miles + ' mi from ' + (a.near.label || 'an incident'));
  return lines.join('\n');
}

async function loadAircraft() {
  let reply;
  try { reply = await (await fetch('/api/aircraft')).json(); } catch (e) { return; }
  if (!reply.enabled) return false;
  aircraft = reply.aircraft || [];
  const seen = new Set();
  aircraft.forEach(a => {
    seen.add(a.hex);
    let m = aircraftMarkers[a.hex];
    const icon = L.divIcon({ className: 'heli' + (a.medical || a.watched ? ' medical' : ''), html: '🚁', iconSize: [22, 22] });
    if (!m) {
      m = { marker: L.marker([a.lat, a.lon], { icon, zIndexOffset: 1000 }).addTo(aircraftLayer),
            trail: L.polyline(a.trail, { color: a.medical || a.watched ? '#d33c2f' : '#555', weight: 2, opacity: 0.6, dashArray: '4 4' }).addTo(aircraftLayer) };
      m.marker.bindTooltip('', { permanent: true, direction: 'right', offset: [10, 0], className: 'heli-label' });
      m.marker.bindPopup('', { minWidth: 240 });
      aircraftMarkers[a.hex] = m;
    }
    m.marker.setLatLng([a.lat, a.lon]).setIcon(icon);
    m.marker.setTooltipContent(aircraftName(a) + (a.alt_ft != null ? ' ' + (a.alt_ft === 0 ? 'GND' : Math.round(a.alt_ft / 100) * 100 + ' ft') : ''));
    const pop = el('div', 'pop');
    pop.style.whiteSpace = 'pre-line';
    pop.textContent = aircraftText(a);
    m.marker.setPopupContent(pop);
    m.trail.setLatLngs(a.trail);
  });
  Object.keys(aircraftMarkers).forEach(hex => {
    if (!seen.has(hex)) { aircraftLayer.removeLayer(aircraftMarkers[hex].marker); aircraftLayer.removeLayer(aircraftMarkers[hex].trail); delete aircraftMarkers[hex]; }
  });
  return true;
}

// ---- PennDOT crashes, closures, roadwork and traffic cameras from 511PA ([traffic] in config.toml)
const roadLayer = L.layerGroup();
const roadworkLayer = L.layerGroup();
const cameraLayer = L.layerGroup();
const ROAD_KINDS = { incident: ['⚠️', 'Incident'], closure: ['⛔', 'Road closed'], roadwork: ['🚧', 'Roadwork'] };
let roadEvents = [];
let cameras = [];
let matchMiles = 0.5;
let cameraIds = '';
let roadPopupOpen = false;
let cameraMarkers = {};

function miles(lat1, lon1, lat2, lon2) {
  const r = Math.PI / 180, a = Math.sin((lat2 - lat1) * r / 2) ** 2
    + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin((lon2 - lon1) * r / 2) ** 2;
  return 3958.8 * 2 * Math.asin(Math.sqrt(a));
}

function roadTitle(e) {
  const kind = ROAD_KINDS[e.kind] || ROAD_KINDS.incident;
  const what = e.type && e.kind !== 'closure' ? e.type.charAt(0).toUpperCase() + e.type.slice(1) : kind[1];
  return what + (e.roadway ? ' · ' + e.roadway : '');
}

function roadEventsAt(incident) {
  const here = roadEvents.filter(e => e.kind !== 'roadwork' && miles(incident.lat, incident.lon, e.lat, e.lon) <= matchMiles);
  if (!here.length) return '';
  return '🚦 PennDOT: ' + here.map(e => roadTitle(e)).join('; ');
}

function camerasNear(lat, lon, limit) {
  return cameras.map(c => [miles(lat, lon, c.lat, c.lon), c]).filter(x => x[0] <= 1.5)
    .sort((a, b) => a[0] - b[0]).slice(0, limit).map(x => x[1]);
}

function cameraButtons(lat, lon) {
  const near = camerasNear(lat, lon, 4);
  if (!near.length) return null;
  const box = el('div', 'cams');
  box.append(el('span', 'muted', 'Cameras nearby:'));
  near.forEach(c => {
    const b = el('button', null, '📷 ' + (c.name || c.roadway));
    b.onclick = () => { const m = cameraMarkers[c.id]; if (!m) return;
      if (!map.hasLayer(cameraLayer)) map.addLayer(cameraLayer);
      map.closePopup(); m.openPopup(); };
    box.append(b);
  });
  return box;
}

function roadPopup(e) {
  const pop = el('div', 'pop');
  pop.append(el('div', 'where', (ROAD_KINDS[e.kind] || ROAD_KINDS.incident)[0] + ' ' + roadTitle(e)));
  if (e.direction && e.direction !== 'BOTHDIR') pop.append(el('div', 'muted', e.direction));
  pop.append(el('div', null, e.description));
  if (e.lanes) pop.append(el('div', 'muted', 'Lanes: ' + e.lanes));
  const when = [];
  if (e.start) when.push('Since ' + time(e.start));
  if (e.updated) when.push('updated ' + time(e.updated));
  if (when.length) pop.append(el('div', 'muted', when.join(' · ')));
  const cams = cameraButtons(e.lat, e.lon);
  if (cams) pop.append(cams);
  pop.append(el('div', 'credit', 'Source: PennDOT 511PA'));
  return pop;
}

function cameraPopup(c) {
  const pop = el('div', 'pop camera');
  pop.append(el('div', 'where', '📷 ' + (c.name || c.roadway)));
  let view = c.views[0];
  const img = el('img');
  img.alt = 'Traffic camera picture';
  const note = el('div', 'muted', c.views.length > 1 ? '' : view.description);
  const actions = el('div', 'actions');
  let timer = null;
  const still = () => { img.src = 'api/traffic/cameras/' + view.image_id + '/image?t=' + Date.now(); };
  if (c.views.length > 1) {
    const choose = el('select');
    c.views.forEach((v, i) => { const o = el('option', null, v.description || 'View ' + (i + 1)); o.value = i; choose.append(o); });
    choose.onchange = () => { view = c.views[+choose.value]; still(); };
    actions.append(choose);
  }
  // PennDOT only plays live video on its own site: open 511PA's map on this camera, then Show Video there.
  if (c.page && c.views.some(v => v.live)) {
    const live = el('a', null, '▶ Live video on 511PA');
    live.href = c.page; live.target = '_blank'; live.rel = 'noopener';
    live.title = "Opens this camera on 511PA's map; press Show Video there";
    actions.append(live);
  }
  pop.append(img, note, actions, el('div', 'credit', 'Live from PennDOT 511PA · not recorded'));
  pop.start = () => { still(); timer = setInterval(still, 5000); };
  pop.stop = () => { clearInterval(timer); };
  return pop;
}

function drawRoadEvents() {
  roadLayer.clearLayers();
  roadworkLayer.clearLayers();
  // Roadwork first, then closures and crashes on top.
  [...roadEvents].reverse().forEach(e => {
    const target = e.kind === 'roadwork' ? roadworkLayer : roadLayer;
    const kind = ROAD_KINDS[e.kind] || ROAD_KINDS.incident;
    if (e.path && e.path.length > 1) {
      L.polyline(e.path, { color: e.kind === 'roadwork' ? '#e0a100' : '#d33c2f', weight: 5, opacity: 0.6 }).addTo(target);
    }
    const icon = L.divIcon({ className: 'road' + (e.major ? ' major' : ''), html: kind[0], iconSize: [24, 24] });
    const m = L.marker([e.lat, e.lon], { icon, zIndexOffset: e.kind === 'roadwork' ? -500 : 500 }).addTo(target);
    m.bindTooltip(roadTitle(e));
    m.bindPopup(() => roadPopup(e), { maxWidth: 360, autoPanPadding: [16, 16] });
    m.on('popupopen', () => { roadPopupOpen = true; });
    m.on('popupclose', () => { roadPopupOpen = false; });
  });
}

function drawCameras() {
  cameraLayer.clearLayers();
  cameraMarkers = {};
  cameras.forEach(c => {
    const icon = L.divIcon({ className: 'cam', html: '📷', iconSize: [18, 18] });
    const m = L.marker([c.lat, c.lon], { icon }).addTo(cameraLayer);
    m.bindTooltip(c.name || c.roadway);
    let pop = null;
    m.bindPopup(() => { pop = cameraPopup(c); return pop; }, { minWidth: 280, maxWidth: 380, autoPanPadding: [16, 16] });
    m.on('popupopen', () => { roadPopupOpen = true; if (pop) pop.start(); });
    m.on('popupclose', () => { roadPopupOpen = false; if (pop) pop.stop(); });
    cameraMarkers[c.id] = m;
  });
}

async function loadTraffic() {
  let reply;
  try { reply = await (await fetch('api/traffic')).json(); } catch (e) { return; }
  if (!reply.enabled) return false;
  matchMiles = reply.match_miles || 0.5;
  roadEvents = reply.events || [];
  if (!roadPopupOpen) drawRoadEvents();
  const ids = (reply.cameras || []).map(c => c.id).join(',');
  if (ids !== cameraIds && !roadPopupOpen) { cameras = reply.cameras || []; cameraIds = ids; drawCameras(); }
  return true;
}

function addTrafficControl() {
  const overlays = { '⚠️ PennDOT crashes &amp; closures': roadLayer, '🚧 PennDOT roadwork': roadworkLayer, '📷 Traffic cameras': cameraLayer };
  const keys = { '⚠️ PennDOT crashes &amp; closures': 'road', '🚧 PennDOT roadwork': 'roadwork', '📷 Traffic cameras': 'cameras' };
  const on = stored('map.trafficLayers', { road: true, roadwork: false, cameras: true });
  Object.entries(overlays).forEach(([name, l]) => { if (on[keys[name]]) l.addTo(map); });
  // On a phone the open list covers part of the map, so it folds into a button there.
  L.control.layers(null, overlays, { collapsed: window.matchMedia('(max-width: 1100px)').matches }).addTo(map);
  const save = () => store('map.trafficLayers', Object.fromEntries(Object.entries(overlays).map(([n, l]) => [keys[n], map.hasLayer(l)])));
  map.on('overlayadd overlayremove', save);
}

function buildTypes() {
  const colors = COLORS();
  TYPES.forEach(([key, name]) => {
    const label = el('label');
    const box = el('input'); box.type = 'checkbox'; box.checked = shownTypes.has(key);
    box.onchange = () => {
      box.checked ? shownTypes.add(key) : shownTypes.delete(key);
      store('map.types', [...shownTypes]);
      render(lastIncidents);
    };
    const dot = el('span', 'dot'); dot.style.background = colors[key];
    label.append(box, dot, name);
    $('types').append(label);
  });
}
buildTypes();
$('seen').addEventListener('click', () => {
  seenUpTo = lastIncidents.reduce((m, i) => Math.max(m, i.id), seenUpTo || 0);
  seenIds = new Set();
  store('map.seenUpTo', seenUpTo); store('map.seenIds', []);
  render(lastIncidents);
});

// Start of the chosen time range, in seconds. "This week" starts Sunday at midnight.
function rangeStart(value) {
  if (value === 'today' || value === 'week') {
    const d = new Date(); d.setHours(0, 0, 0, 0);
    if (value === 'week') d.setDate(d.getDate() - d.getDay());
    return Math.floor(d.getTime() / 1000);
  }
  return Math.floor(Date.now() / 1000) - Number(value);
}

// The reply's tag from last time: an unchanged list comes back as an empty 304, which saves a phone
// re-downloading every incident every 10 seconds.
let incidentsTag = null;
async function load() {
  const since = rangeStart($('range').value);
  const p = new URLSearchParams({ since, hidden: $('hidden').checked });
  try {
    const res = await fetch('api/incidents?' + p, { headers: incidentsTag ? { 'If-None-Match': incidentsTag } : {} });
    if (res.status === 304) return;
    const incidents = await res.json();
    render(incidents);
    incidentsTag = res.headers.get('ETag');
  } catch (e) { $('status').textContent = 'service unreachable'; }
}

async function status() {
  try {
    const s = await (await fetch('api/map/status')).json();
    const list = $('list');
    list.querySelectorAll('.notice').forEach(n => n.remove());
    if (!s.enabled) { list.prepend(el('div', 'notice', 'The incident map is turned off in config.toml ([map] enabled).')); return s; }
    if (!s.streets) list.prepend(el('div', 'notice', 'No street list yet. Run fetch-places.bat once to download local streets, then new calls will be mapped.'));
    else if (!s.has_shapes) list.prepend(el('div', 'notice', 'Street names are loaded but not road shapes, so intersections can\'t be placed. Run fetch-places.bat to get places-geo.json.'));
    $('status').textContent = `${s.streets} streets in ${s.towns} towns` + (s.online_lookup ? ' · address lookup on' : ' · offline') +
      (s.queue ? ` · ${s.queue} calls to check` : '');
    return s;
  } catch (e) { $('status').textContent = 'service unreachable'; return null; }
}

function playing() { return [...document.querySelectorAll('audio')].some(a => !a.paused); }

// ---- editing a transcript, the same as on the call log page

let editing = 0;
let needsReload = false;
function editTranscript(card, shown, call, saved) {
  if (card.querySelector('textarea')) return;
  editing++;
  const box = el('textarea', 'fix-text');
  box.value = call.transcript || '';
  box.rows = Math.max(2, Math.ceil(box.value.length / 50));
  const row = el('div', 'row');
  const save = el('button', '', 'Save'), cancel = el('button', '', 'Cancel');
  const note = el('span', 'muted', 'Words you replace are fixed in later calls too.');
  row.append(save, cancel, note);
  shown.replaceWith(box);
  box.after(row);
  box.focus();
  const done = () => { editing = Math.max(0, editing - 1); };
  cancel.onclick = () => { box.replaceWith(shown); row.remove(); done(); };
  save.onclick = async () => {
    save.disabled = true;
    try {
      const r = await fetch('api/calls/' + call.id + '/transcript', { method: 'POST',
        headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: box.value }) });
      if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
      const result = await r.json();
      call.transcript = result.transcript;
      const fresh = el('div', 'text', result.transcript || 'no speech found');
      box.replaceWith(fresh);
      row.replaceChildren(el('span', 'fixed', 'Saved.'));
      result.learned.forEach((c, i) => {
        row.append(i ? ', ' : ' Learned: ', c.heard + ' \u2192 ' + c.correct + ' ');
        const undo = el('button', '', 'Undo');
        undo.onclick = async () => {
          const u = await fetch('api/corrections/forget', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                                           body: JSON.stringify({ heard: c.heard, correct: c.correct }) });
          undo.replaceWith(u.ok ? '(undone)' : '(could not undo)');
        };
        row.append(undo);
      });
      if (saved) saved(result);
      setTimeout(done, result.learned.length ? 15000 : 0);
    } catch (e) {
      save.disabled = false;
      note.textContent = 'Not saved: ' + e.message;
    }
  };
}

// ---- live calls: the newest transcripts and tone-outs, as they come in

function feedCall(c) {
  const card = el('div', 'feed-call' + (c.incident_id ? ' in-incident' : ''));
  card.append(el('div', 'muted', clock(c.call_time) + ' · ' + (c.talkgroup_label || c.talkgroup) +
    (c.duration_s ? ' · ' + c.duration_s.toFixed(0) + ' s' : '') + (c.corrected_at ? ' · fixed by hand' : '')));
  let text;
  if (c.status === 'done') text = el('div', 'text' + (c.transcript ? '' : ' none'), c.transcript || (c.error === 'tones only' ? 'tones only, no speech' : 'no speech found'));
  else if (['queued', 'processing'].includes(c.status)) text = el('div', 'text none', 'transcribing…');
  else text = el('div', 'text none', 'not transcribed' + (c.error ? ' (' + c.error + ')' : ''));
  card.append(text);
  if (c.summary) { const sum = el('div', 'summary'); sum.append(el('span', 'ai', 'AI'), c.summary); card.append(sum); }
  const row = el('div', 'row');
  const play = el('button', '', c.audio_deleted_at ? 'Audio deleted' : 'Play');
  play.disabled = !!c.audio_deleted_at;
  play.onclick = () => {
    let audio = card.querySelector('audio');
    if (!audio) { audio = el('audio'); audio.controls = true; audio.src = 'api/calls/' + c.id + '/audio'; card.append(audio); }
    audio.play();
  };
  row.append(play);
  if (['done', 'skipped', 'failed'].includes(c.status)) {
    const edit = el('button', '', 'Edit');
    edit.onclick = () => editTranscript(card, card.querySelector('.text'), c, () => { needsReload = true; });
    row.append(edit);
  }
  if (c.incident_id) {
    const show = el('button', '', 'Show on map');
    show.onclick = () => showIncident(c.incident_id);
    row.append(show);
  }
  card.append(row);
  return card;
}

function feedPage(p) {
  const tones = p.tone_b ? p.tone_a.toFixed(1) + ' + ' + p.tone_b.toFixed(1) + ' Hz' : p.tone_a.toFixed(1) + ' Hz long tone';
  return el('div', 'feed-page', clock(p.page_time) + ' Tone out: ' + (p.label || 'not on the station list') + ' (' + tones + ')');
}

async function loadFeed() {
  const pane = $('feed');
  // Leave it alone while a clip plays, a fix is being typed, or the list is scrolled down.
  if (editing || playing() || pane.scrollTop > 120) return;
  try {
    const calls = await (await fetch('api/calls?limit=50')).json();
    const since = calls.length ? calls[calls.length - 1].call_time : Math.floor(Date.now() / 1000) - 3600;
    const pages = await (await fetch('api/pages?' + new URLSearchParams({ since, limit: 50 }))).json();
    const items = calls.map(c => ({ t: c.call_time, node: () => feedCall(c) }))
      .concat(pages.map(p => ({ t: p.page_time, node: () => feedPage(p) })))
      .sort((a, b) => b.t - a.t);
    $('feed-items').replaceChildren(...items.map(i => i.node()));
  } catch (e) { /* shown in the status line */ }
}

function showIncident(id) {
  const marker = markers[id];
  const incident = lastIncidents.find(i => i.id === id);
  if (!marker || !incident) { $('status').textContent = 'That incident is outside the time range or types shown'; return; }
  pick('map');
  map.setView([incident.lat, incident.lon], Math.max(map.getZoom(), 15));
  marker.openPopup();
}

// Tabs on narrow screens.
function pick(pane) {
  document.querySelectorAll('.body > div').forEach(d => d.classList.toggle('shown', d.id === pane));
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.pane === pane));
  store('map.pane', pane);
  if (pane === 'map') setTimeout(() => map.invalidateSize(), 0);
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => pick(b.dataset.pane));
pick(stored('map.pane', 'map'));
map.on('popupclose', () => { if (needsReload) { needsReload = false; load(); } });

(async () => {
  const s = await status();
  const area = (s && s.area) || [40.50, -75.62, 40.78, -75.17];
  map.fitBounds([[area[0], area[1]], [area[2], area[3]]]);
  L.tileLayer((s && s.tiles_url) || 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  }).addTo(map);
  const watchingAircraft = await loadAircraft();
  const watchingTraffic = await loadTraffic();
  if (watchingTraffic) addTrafficControl();
  await load();
  // Opened from the unit board: map#incident-12
  const linked = /^#incident-(\d+)$/.exec(location.hash);
  if (linked) showIncident(Number(linked[1]));
  loadFeed();
  setInterval(loadFeed, 5000);
  if (watchingAircraft) setInterval(loadAircraft, 5000);
  if (watchingTraffic) setInterval(loadTraffic, 60000);
  setInterval(async () => { await status(); if (!popupOpen && !playing() && !editing) await load(); }, 10000);
})();
$('range').value = stored('map.range', '86400');
if (!$('range').value) $('range').value = '86400';
$('range').addEventListener('change', () => { store('map.range', $('range').value); fitted = false; incidentsTag = null; load(); });
$('hidden').addEventListener('change', () => { incidentsTag = null; load(); });
$('multi').checked = stored('map.multi', false);
$('multi').addEventListener('change', () => { store('map.multi', $('multi').checked); render(lastIncidents); });
</script>
